name: FileSystemTool tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      HAS_GIST_SECRET: ${{ secrets.GIST_SECRET != '' }}

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python 3.10
      uses: actions/setup-python@v6
      with:
        python-version: "3.10"

    - name: Install dependencies
      working-directory: ./3_1_LLM_agent
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov

    - name: Run unit tests with coverage
      working-directory: ./3_1_LLM_agent
      env:
        PYTHONPATH: .
      run: |
        python -m pytest tests/test_filesystem_tool.py -v \
          --cov=llm_agent.tool_filesystem --cov-report=term-missing
        echo "COVERAGE=$(python -m coverage report --format=total)" >> $GITHUB_ENV

    - name: Update coverage badge
      if: github.event_name == 'push' && env.HAS_GIST_SECRET == 'true'
      uses: schneegans/dynamic-badges-action@v1.9.0
      with:
        auth: ${{ secrets.GIST_SECRET }}
        gistID: ${{ vars.GIST_ID }}
        filename: filesystem_tool_coverage.json
        label: coverage
        message: ${{ env.COVERAGE }}%
        valColorRange: ${{ env.COVERAGE }}
        minColorRange: 50
        maxColorRange: 90
